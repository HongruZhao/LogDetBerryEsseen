name: Inspect moving-H public baseline

on:
  push:
    branches:
      - moving-h-lean-audit-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect archived source modules and declarations
        shell: bash
        run: |
          set -euo pipefail
          rm -rf inspect
          mkdir inspect
          unzip -q logdet_Berry_Esseen_PTRF_Lean_verification_v1.1.2.zip -d inspect
          toolroot="$(find inspect -type f -name lean-toolchain -printf '%h\n' | head -n 1)"
          coherence="$(find inspect -type d -path '*/LogdetLean/Coherence' | head -n 1)"
          if [ -z "$coherence" ]; then
            echo 'No LogdetLean/Coherence directory found.' >&2
            find inspect -maxdepth 5 -type d | sort | sed -n '1,500p'
            exit 1
          fi
          project="${coherence%/LogdetLean/Coherence}"
          echo "TOOLROOT=$toolroot"
          echo "PROJECT=$project"
          echo "COHERENCE=$coherence"
          echo '=== MOVING-H FILES ==='
          find "$coherence" -maxdepth 1 -type f -name 'MovingH*.lean' -printf '%f\n' | sort
          echo '=== CONTRACT DECLARATIONS ==='
          grep -RIn --include='*.lean' -E 'MovingHLindebergCLTWitness|PaperMatrixExtremeCDFContract|PaperDampedPasteupContract|movingPaperJointCDFLimit|movingAccompanyingCDF|movingPaperJointCDF|Paper.*Contract' "$coherence" | sed -n '1,1600p' || true
          echo '=== ENDPOINT-LIKE FILE CONTENTS ==='
          shopt -s nullglob
          for f in "$coherence"/MovingH*Endpoint*.lean "$coherence"/MovingH*Matrix*.lean "$coherence"/MovingH*Pasteup*.lean; do
            echo "--- $f"
            sed -n '1,360p' "$f"
          done

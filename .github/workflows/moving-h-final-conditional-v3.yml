name: Moving-H final conditional endpoint v3

on:
  push:
    branches:
      - moving-h-lean-audit-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the audit branch
        uses: actions/checkout@v4

      - name: Reconstruct and patch the source tree
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf working reconstructed
          mkdir -p working reconstructed
          unzip -q logdet_Berry_Esseen_PTRF_Lean_verification_v1.1.2.zip -d working
          project="$(find working -type f -name lean-toolchain -printf '%h\n' | head -n 1)"
          test -n "$project"

          python3 - <<'PY'
          import base64
          import glob
          import lzma
          from pathlib import Path

          def clean_text(path: str) -> bytes:
              text = Path(path).read_text(encoding="utf-8")
              return b"".join(text.encode("ascii").split())

          def decode_xz(pattern: str, output: str) -> None:
              paths = sorted(glob.glob(pattern))
              if not paths:
                  raise SystemExit(f"no files matched {pattern}")
              cleaned = [clean_text(path) for path in paths]
              candidates: list[tuple[str, bytes]] = []

              try:
                  candidates.append((
                      "individually encoded chunks",
                      b"".join(base64.b64decode(chunk, validate=True) for chunk in cleaned),
                  ))
              except Exception as exc:
                  print(f"individual decode rejected for {pattern}: {exc}")

              try:
                  candidates.append((
                      "one Base64 stream split across files",
                      base64.b64decode(b"".join(cleaned), validate=True),
                  ))
              except Exception as exc:
                  print(f"concatenated decode rejected for {pattern}: {exc}")

              for description, payload in candidates:
                  if not payload.startswith(b"\xfd7zXZ\x00"):
                      print(f"candidate is not XZ ({description}, {pattern})")
                      continue
                  try:
                      lzma.decompress(payload)
                  except Exception as exc:
                      print(f"XZ validation rejected ({description}, {pattern}): {exc}")
                      continue
                  Path(output).write_bytes(payload)
                  print(
                      f"decoded {pattern} using {description}: "
                      f"{len(payload)} bytes -> {output}"
                  )
                  return
              raise SystemExit(f"could not reconstruct a valid XZ archive from {pattern}")

          decode_xz("moving-h-ci/minimal.part*", "reconstructed/minimal.tar.xz")
          decode_xz("moving-h-ci/missing2.part*", "reconstructed/missing.tar.xz")
          decode_xz(
              "moving-h-progress/missing-closure.tar.xz.b64",
              "reconstructed/closure.tar.xz",
          )
          PY

          for archive in reconstructed/minimal.tar.xz reconstructed/missing.tar.xz reconstructed/closure.tar.xz; do
            xz -t "$archive"
            tar -xJf "$archive" -C "$project"
          done

          install -m 0644 moving-h-final/MovingHConditionalEndpoint.lean \
            "$project/LogdetLean/Coherence/MovingHConditionalEndpoint.lean"
          install -m 0644 moving-h-final/MovingHConditionalEndpointAxiomAudit.lean \
            "$project/LogdetLean/Coherence/MovingHConditionalEndpointAxiomAudit.lean"

          rm -f \
            "$project/LogdetLean/Coherence/MovingHExternalBoundary.lean" \
            "$project/LogdetLean/Coherence/MovingHExternalBoundaryAxiomAudit.lean"

          if grep -q '^import LogdetLean\.Coherence\.MovingHExternalBoundary$' \
              "$project/LogdetLean/Coherence.lean"; then
            sed -i \
              's/^import LogdetLean\.Coherence\.MovingHExternalBoundary$/import LogdetLean.Coherence.MovingHConditionalEndpoint/' \
              "$project/LogdetLean/Coherence.lean"
          fi

          required=(
            LogdetLean/Coherence/MovingHMDPerturbationDischarge.lean
            LogdetLean/Coherence/MovingHEasyConsequences.lean
            LogdetLean/Coherence/MovingHCurtissVoidBridge.lean
            LogdetLean/Coherence/MovingHConditionalEndpoint.lean
            LogdetLean/Coherence/MovingHConditionalEndpointAxiomAudit.lean
          )
          for file in "${required[@]}"; do
            test -f "$project/$file" || {
              echo "required source is missing: $file" >&2
              exit 1
            }
          done
          test ! -e "$project/LogdetLean/Coherence/MovingHExternalBoundary.lean"
          grep -qx 'import LogdetLean.Coherence.MovingHConditionalEndpoint' \
            "$project/LogdetLean/Coherence.lean"

          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "Lean project: $project"
          printf 'Lean source files: '
          find "$project" -type f -name '*.lean' | wc -l

      - name: Install the exact Lean toolchain and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: ${{ steps.locate.outputs.project }}
          build: false
          test: false
          lint: false
          use-github-cache: true
          nanoda: false

      - name: Compile the conditional endpoint
        shell: bash
        run: |
          set -euo pipefail
          cd '${{ steps.locate.outputs.project }}'
          {
            echo "UTC start: $(date -u +%FT%TZ)"
            lean --version
            lake --version
            printf 'Mathlib commit: '
            git -C .lake/packages/mathlib rev-parse HEAD
            lake build LogdetLean.Coherence.MovingHConditionalEndpointAxiomAudit
            echo "UTC end: $(date -u +%FT%TZ)"
          } 2>&1 | tee "$GITHUB_WORKSPACE/moving-h-final-build.log"

      - name: Print the transitive axiom dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd '${{ steps.locate.outputs.project }}'
          lake env lean LogdetLean/Coherence/MovingHConditionalEndpointAxiomAudit.lean \
            2>&1 | tee "$GITHUB_WORKSPACE/moving-h-final-axioms.log"
          if grep -E \
              'external_paperHighDimensionalWishartInput|external_paperFiniteMeasureCurtissBridge' \
              "$GITHUB_WORKSPACE/moving-h-final-axioms.log"; then
            echo 'A removed project axiom appeared in #print axioms output.' >&2
            exit 1
          fi

      - name: Audit active declarations and placeholders
        shell: bash
        run: |
          set -euo pipefail
          cd '${{ steps.locate.outputs.project }}'

          grep -RInE --include='*.lean' \
            '^[[:space:]]*(axiom|opaque)[[:space:]]+' \
            LogdetLean SampleCorrIndLean \
            > "$GITHUB_WORKSPACE/moving-h-final-project-axioms.log" || true
          if test -s "$GITHUB_WORKSPACE/moving-h-final-project-axioms.log"; then
            cat "$GITHUB_WORKSPACE/moving-h-final-project-axioms.log"
            echo 'An active project axiom or opaque declaration remains.' >&2
            exit 1
          fi

          grep -RInE --include='*.lean' \
            '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' \
            LogdetLean SampleCorrIndLean \
            > "$GITHUB_WORKSPACE/moving-h-final-placeholder-scan.log" || true

          grep -RIn --include='*.lean' -E \
            'external_paperHighDimensionalWishartInput|external_paperFiniteMeasureCurtissBridge' \
            LogdetLean SampleCorrIndLean \
            > "$GITHUB_WORKSPACE/moving-h-final-legacy-name-scan.log" || true
          if test -s "$GITHUB_WORKSPACE/moving-h-final-legacy-name-scan.log"; then
            cat "$GITHUB_WORKSPACE/moving-h-final-legacy-name-scan.log"
            echo 'A legacy moving-H external declaration name remains active.' >&2
            exit 1
          fi

          {
            echo 'PASS'
            echo 'No active project axiom or opaque declaration.'
            echo 'No legacy moving-H external axiom name.'
            echo 'Any placeholder-token matches are listed separately for manual comment inspection.'
          } | tee "$GITHUB_WORKSPACE/moving-h-final-integrity-summary.log"

      - name: Build the Coherence umbrella module
        shell: bash
        run: |
          set -euo pipefail
          cd '${{ steps.locate.outputs.project }}'
          lake build LogdetLean.Coherence \
            2>&1 | tee "$GITHUB_WORKSPACE/moving-h-coherence-build.log"

      - name: Package the exact patched source
        shell: bash
        run: |
          set -euo pipefail
          project='${{ steps.locate.outputs.project }}'
          tar -I 'zstd -12 -T0' -cf moving-H-axiom-free-conditional-source.tar.zst \
            --exclude='.lake' --exclude='.git' -C "$project" .
          sha256sum moving-H-axiom-free-conditional-source.tar.zst \
            > moving-H-axiom-free-conditional-source.sha256

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moving-h-final-v3-verification-evidence
          path: |
            moving-h-final-build.log
            moving-h-final-axioms.log
            moving-h-final-project-axioms.log
            moving-h-final-placeholder-scan.log
            moving-h-final-legacy-name-scan.log
            moving-h-final-integrity-summary.log
            moving-h-coherence-build.log
          if-no-files-found: warn

      - name: Upload patched source archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: moving-h-axiom-free-conditional-source-v3
          compression-level: 0
          path: |
            moving-H-axiom-free-conditional-source.tar.zst
            moving-H-axiom-free-conditional-source.sha256
          if-no-files-found: error

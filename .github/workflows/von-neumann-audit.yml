name: Von Neumann typicality Lean audit

on:
  push:
    branches:
      - agent/von-neumann-typicality-audit-2026-08-15
  workflow_dispatch:

jobs:
  build-minimal-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and inspect source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat vn_bundle_parts/part_* | base64 --decode > vn_minimal.reconstructed.tar.gz
          echo 'f2a6bbbcc47164147c52fa9ef78d1dbcfd41c3bdc0a247b2a6e5ea0fa437e6de  vn_minimal.reconstructed.tar.gz' | sha256sum --check
          tar -xzf vn_minimal.reconstructed.tar.gz
          cp -a vn_overlay/. vn_minimal_project/
          test -f vn_minimal_project/lean-toolchain
          test -f vn_minimal_project/lake-manifest.json
          test -f vn_minimal_project/LogdetLean/VonNeumannTypicality/AxiomAudit.lean
          test -f vn_minimal_project/LogdetLean/VonNeumannTypicality/WeakTypicality/VariableDimension.lean
          if grep -RInE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' \
              vn_minimal_project/LogdetLean/VonNeumannTypicality \
              vn_minimal_project/LogdetLean/VonNeumannTypicality.lean; then
            echo 'Found a proof placeholder in the paper-specific source.' >&2
            exit 1
          fi

      - name: Build paper-specific modules
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: vn_minimal_project
          build: true
          build-args: "LogdetLean.VonNeumannTypicality LogdetLean.VonNeumannTypicality.Entropy.VariableDimensionCutoff LogdetLean.VonNeumannTypicality.WeakTypicality.VariableDimension LogdetLean.VonNeumannTypicality.WeakTypicality.ExactReduction LogdetLean.VonNeumannTypicality.Covariance.BlockAlgebra LogdetLean.VonNeumannTypicality.Concentration.ApproximationTransfer LogdetLean.VonNeumannTypicality.Concentration.BorelCantelliTransfer LogdetLean.VonNeumannTypicality.Concentration.VarianceTransfer LogdetLean.VonNeumannTypicality.AxiomAudit"
          use-mathlib-cache: true
          leanchecker: false

      - name: Re-run the aggregate axiom audit directly
        shell: bash
        working-directory: vn_minimal_project
        run: |
          set -euo pipefail
          lake env lean LogdetLean/VonNeumannTypicality/AxiomAudit.lean | tee axiom-audit.log
          if grep -E 'depends on axioms:.*sorryAx' axiom-audit.log; then
            echo 'Unexpected project axiom detected.' >&2
            exit 1
          fi

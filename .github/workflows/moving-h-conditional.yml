name: Moving-H axiom-free conditional verification

on:
  push:
    branches:
      - moving-h-lean-audit-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conditional-kernel-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4

      - name: Reconstruct the focused handoff project
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf working
          mkdir working
          unzip -q logdet_Berry_Esseen_PTRF_Lean_verification_v1.1.2.zip -d working
          project="$(find working -type f -name lean-toolchain -printf '%h\n' | head -n 1)"
          if [ -z "$project" ]; then
            echo 'No Lean project was found in the archived release.' >&2
            exit 1
          fi

          cat moving-h-ci/minimal.part* | base64 --decode > moving-h-minimal.tar.xz
          echo '0bc21734f177e621e498b15dba3a80ef32192b8e8645957fc8f7dadc13ecfc2f  moving-h-minimal.tar.xz' | sha256sum --check
          xz -t moving-h-minimal.tar.xz
          tar -xJf moving-h-minimal.tar.xz -C "$project"

          ls -l moving-h-ci/missing2.part*
          sha256sum moving-h-ci/missing2.part*
          cat moving-h-ci/missing2.part* | base64 --decode > moving-h-missing.tar.xz
          sha256sum moving-h-missing.tar.xz
          xz -t moving-h-missing.tar.xz
          tar -xJf moving-h-missing.tar.xz -C "$project"

          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "Lean project: $project"
          printf 'Lean source files in focused reconstruction: '
          find "$project" -type f -name '*.lean' | wc -l
          test -f "$project/LogdetLean/Coherence/RareBernoulliPoisson.lean"
          test -f "$project/LogdetLean/Coherence/WishartLeadingVariance.lean"
          test -f "$project/LogdetLean/Coherence/MovingHExternalBoundary.lean"
          find "$project/LogdetLean/Coherence" -maxdepth 1 -type f -name 'MovingH*.lean' | sort

      - name: Install pinned Lean and obtain Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: ${{ steps.locate.outputs.project }}
          build: false
          test: false
          lint: false
          use-github-cache: true
          nanoda: false

      - name: Build the moving-H audit target
        shell: bash
        run: |
          set -euo pipefail
          cd '${{ steps.locate.outputs.project }}'
          lake build LogdetLean.Coherence.MovingHExternalBoundaryAxiomAudit 2>&1 | tee "$GITHUB_WORKSPACE/moving-h-build.log"

      - name: Print theorem axiom dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd '${{ steps.locate.outputs.project }}'
          lake env lean LogdetLean/Coherence/MovingHExternalBoundaryAxiomAudit.lean 2>&1 | tee "$GITHUB_WORKSPACE/moving-h-axioms.log"
          if grep -E 'external_paperHighDimensionalWishartInput|external_paperFiniteMeasureCurtissBridge' "$GITHUB_WORKSPACE/moving-h-axioms.log"; then
            echo 'A removed project axiom reappeared in the dependency audit.' >&2
            exit 1
          fi

      - name: Run source-integrity and endpoint scans
        shell: bash
        run: |
          set -euo pipefail
          cd '${{ steps.locate.outputs.project }}'
          python3 scripts/scan_lean_integrity.py . 2>&1 | tee "$GITHUB_WORKSPACE/moving-h-integrity.log"
          {
            echo '# Moving-H endpoint inventory'
            echo
            grep -RIn --include='*.lean' -E 'theorem paperTheorem_movingAccompanying_from_M1_M4_and_(direct_estimates|laplace_curtiss)|theorem paperTheorem_movingAccompanying_from_explicit_M1_M4_and_direct_estimates' LogdetLean/Coherence
          } | tee "$GITHUB_WORKSPACE/moving-h-endpoints.log"

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: moving-h-conditional-verification-evidence
          path: |
            moving-h-build.log
            moving-h-axioms.log
            moving-h-integrity.log
            moving-h-endpoints.log
          if-no-files-found: error

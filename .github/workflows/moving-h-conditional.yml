name: Moving-H focused reconstruction and audit

on:
  push:
    branches:
      - moving-h-lean-audit-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-kernel-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4

      - name: Reconstruct the focused handoff project
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf working
          mkdir working
          unzip -q logdet_Berry_Esseen_PTRF_Lean_verification_v1.1.2.zip -d working
          project="$(find working -type f -name lean-toolchain -printf '%h\n' | head -n 1)"
          if [ -z "$project" ]; then
            echo 'No Lean project was found in the archived release.' >&2
            exit 1
          fi

          cat moving-h-ci/minimal.part* | base64 --decode > moving-h-minimal.tar.xz
          echo '0bc21734f177e621e498b15dba3a80ef32192b8e8645957fc8f7dadc13ecfc2f  moving-h-minimal.tar.xz' | sha256sum --check
          xz -t moving-h-minimal.tar.xz
          tar -xJf moving-h-minimal.tar.xz -C "$project"

          cat moving-h-ci/missing2.part* | base64 --decode > moving-h-missing.tar.xz
          xz -t moving-h-missing.tar.xz
          tar -xJf moving-h-missing.tar.xz -C "$project"

          cp moving-h-progress/FiniteMeasureCurtissProgress.lean \
            "$project/LogdetLean/FiniteMeasureCurtissProgress.lean"
          cp moving-h-progress/FiniteMeasureCurtissProgressAxiomAudit.lean \
            "$project/LogdetLean/FiniteMeasureCurtissProgressAxiomAudit.lean"
          cp moving-h-progress/MovingHCurtissPositiveMass.lean \
            "$project/LogdetLean/Coherence/MovingHCurtissPositiveMass.lean"
          cp moving-h-progress/MovingHCurtissPositiveMassAxiomAudit.lean \
            "$project/LogdetLean/Coherence/MovingHCurtissPositiveMassAxiomAudit.lean"

          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "Lean project: $project"
          lean_count="$(find "$project" -type f -name '*.lean' | wc -l)"
          echo "Lean source files in focused reconstruction: $lean_count"
          test -f "$project/LogdetLean/Coherence/RareBernoulliPoisson.lean"
          test -f "$project/LogdetLean/WishartLeadingVariance.lean"
          test -f "$project/LogdetLean/Coherence/MovingHExternalBoundary.lean"
          test -f "$project/LogdetLean/Coherence/MovingHExternalBoundaryAxiomAudit.lean"
          test -f "$project/LogdetLean/FiniteMeasureCurtissProgressAxiomAudit.lean"
          test -f "$project/LogdetLean/Coherence/MovingHCurtissPositiveMassAxiomAudit.lean"

      - name: Install pinned Lean and obtain Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: ${{ steps.locate.outputs.project }}
          build: false
          test: false
          lint: false
          use-github-cache: false
          nanoda: false

      - name: Build the finite-measure Curtiss progress audit
        shell: bash
        run: |
          set -euo pipefail
          cd '${{ steps.locate.outputs.project }}'
          lake build LogdetLean.FiniteMeasureCurtissProgressAxiomAudit 2>&1 | tee "$GITHUB_WORKSPACE/curtiss-progress-build.log"
          lake env lean LogdetLean/FiniteMeasureCurtissProgressAxiomAudit.lean 2>&1 | tee "$GITHUB_WORKSPACE/curtiss-progress-axioms.log"

      - name: Build the moving-H positive-mass audit
        shell: bash
        run: |
          set -euo pipefail
          cd '${{ steps.locate.outputs.project }}'
          lake build LogdetLean.Coherence.MovingHCurtissPositiveMassAxiomAudit 2>&1 | tee "$GITHUB_WORKSPACE/moving-h-positive-mass-build.log"
          lake env lean LogdetLean/Coherence/MovingHCurtissPositiveMassAxiomAudit.lean 2>&1 | tee "$GITHUB_WORKSPACE/moving-h-positive-mass-axioms.log"

      - name: Build the focused moving-H boundary audit
        shell: bash
        run: |
          set -euo pipefail
          cd '${{ steps.locate.outputs.project }}'
          lake build LogdetLean.Coherence.MovingHExternalBoundaryAxiomAudit 2>&1 | tee "$GITHUB_WORKSPACE/moving-h-build.log"
          lake env lean LogdetLean/Coherence/MovingHExternalBoundaryAxiomAudit.lean 2>&1 | tee "$GITHUB_WORKSPACE/moving-h-axioms.log"

      - name: Run source-integrity and endpoint scans
        shell: bash
        run: |
          set -euo pipefail
          cd '${{ steps.locate.outputs.project }}'
          python3 scripts/scan_lean_integrity.py . 2>&1 | tee "$GITHUB_WORKSPACE/moving-h-integrity.log"
          {
            echo '# Moving-H endpoint inventory'
            echo
            grep -RIn --include='*.lean' -E 'external_paperHighDimensionalWishartInput|external_paperFiniteMeasureCurtissBridge|paperTheorem_movingAccompanying_from_M1_M4|paperTheorem_movingAccompanying_from_explicit_M1_M4' LogdetLean/Coherence || true
          } | tee "$GITHUB_WORKSPACE/moving-h-endpoints.log"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moving-h-focused-verification-evidence
          path: |
            curtiss-progress-build.log
            curtiss-progress-axioms.log
            moving-h-positive-mass-build.log
            moving-h-positive-mass-axioms.log
            moving-h-build.log
            moving-h-axioms.log
            moving-h-integrity.log
            moving-h-endpoints.log
          if-no-files-found: warn

name: Materialize moving-H baseline interface

on:
  push:
    branches:
      - moving-h-lean-audit-20260815
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: moving-h-lean-audit-20260815
      - name: Extract compact interface
        shell: bash
        run: |
          set -euo pipefail
          rm -rf inspect && mkdir inspect
          unzip -q logdet_Berry_Esseen_PTRF_Lean_verification_v1.1.2.zip -d inspect
          coherence="$(find inspect -type d -path '*/LogdetLean/Coherence' | head -n 1)"
          project="${coherence%/LogdetLean/Coherence}"
          out=moving-h-ci/public-baseline-interface.txt
          {
            echo "PROJECT=$project"
            echo '=== FILES ==='
            find "$coherence" -maxdepth 1 -type f -name 'MovingH*.lean' -printf '%f\n' | sort
            echo '=== DECLARATIONS ==='
            grep -RIn --include='*.lean' -E '^(def|theorem|lemma|structure|class) (MovingH|Paper|movingPaper|movingAccompanying|movingMatrix|movingScalar).*' "$coherence" | grep -E 'CDF|Contract|CLT|Laplace|Pasteup|Product|Joint|Matrix|Scalar' | sed -n '1,900p' || true
            echo '=== CONTRACT CONTEXT ==='
            for term in MovingHCDFCompanionLaw MovingHCDFResidualConvergence movingPaperJointCDFLimit movingPaperMatrixCDFLimit PaperMatrixExtremeCDFContract PaperDampedPasteupContract MovingHLindebergCLTWitness; do
              echo "--- $term"
              grep -RIn --include='*.lean' -B 4 -A 24 "$term" "$coherence" | sed -n '1,240p' || true
            done
          } > "$out"
          wc -l "$out"
      - name: Commit inspection result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add moving-h-ci/public-baseline-interface.txt
          if git diff --cached --quiet; then
            echo 'Interface file unchanged.'
          else
            git commit -m 'ci: materialize moving-H public baseline interface'
            git push origin HEAD:moving-h-lean-audit-20260815
          fi

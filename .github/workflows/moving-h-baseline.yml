name: Moving-H Lean baseline audit

on:
  push:
    branches:
      - moving-h-lean-audit-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4

      - name: Extract the latest archived Lean release
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf baseline
          mkdir baseline
          unzip -q logdet_Berry_Esseen_PTRF_Lean_verification_v1.1.2.zip -d baseline
          project="$(find baseline -type f -name lean-toolchain -printf '%h\n' | head -n 1)"
          if [ -z "$project" ]; then
            echo 'No Lean project was found in the archived release.' >&2
            exit 1
          fi
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "Lean project: $project"
          find "$project" -maxdepth 2 -type f | sort | sed -n '1,120p'

      - name: Build the untouched archived project
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: ${{ steps.locate.outputs.project }}
          build: true
          test: false
          lint: false
          use-github-cache: false
          nanoda: true
          nanoda-allow-sorry: false

      - name: Record baseline scans
        shell: bash
        run: |
          set -euo pipefail
          cd '${{ steps.locate.outputs.project }}'
          {
            echo '# Baseline project inventory'
            echo
            printf 'Lean files: '
            find . -type f -name '*.lean' | wc -l
            printf 'Explicit sorry/admit tokens: '
            grep -RInE --include='*.lean' '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' . | wc -l || true
            printf 'Project axiom declarations: '
            grep -RInE --include='*.lean' '^[[:space:]]*(axiom|opaque)[[:space:]]+' . | wc -l || true
          } | tee "$GITHUB_WORKSPACE/baseline-audit.txt"

      - name: Upload baseline audit
        uses: actions/upload-artifact@v4
        with:
          name: moving-h-baseline-audit
          path: baseline-audit.txt
          if-no-files-found: error

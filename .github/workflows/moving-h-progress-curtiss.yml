name: Moving-H Curtiss progress verification

on:
  push:
    branches:
      - moving-h-progress2-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  curtiss-progress:
    runs-on: ubuntu-latest
    steps:
      - name: Check out progress branch
        uses: actions/checkout@v4

      - name: Prepare import-light Lean project
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf working
          mkdir working
          unzip -q logdet_Berry_Esseen_PTRF_Lean_verification_v1.1.2.zip -d working
          project="$(find working -type f -name lean-toolchain -printf '%h\n' | head -n 1)"
          if [ -z "$project" ]; then
            echo 'No Lean project was found in the archived release.' >&2
            exit 1
          fi

          python3 moving-h-progress/write_standalone_curtiss_progress.py "$project"

          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "Lean project: $project"
          test -f "$project/LogdetLean/FiniteMeasureCurtissProgress.lean"
          test -f "$project/LogdetLean/FiniteMeasureCurtissProgressAxiomAudit.lean"
          grep -nE 'finiteMeasureGaussianMassApproximation_of_laplace|finiteMeasureCDFApproximation_of_small_mass' \
            "$project/LogdetLean/FiniteMeasureCurtissProgress.lean"

      - name: Install pinned Lean and obtain Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: ${{ steps.locate.outputs.project }}
          build: false
          test: false
          lint: false
          use-github-cache: false
          nanoda: false

      - name: Build import-light Curtiss progress audit
        shell: bash
        run: |
          set -euo pipefail
          cd '${{ steps.locate.outputs.project }}'
          lake build LogdetLean.FiniteMeasureCurtissProgressAxiomAudit \
            2>&1 | tee "$GITHUB_WORKSPACE/curtiss-progress-build.log"

      - name: Elaborate permanent axiom audit
        shell: bash
        run: |
          set -euo pipefail
          cd '${{ steps.locate.outputs.project }}'
          lake env lean LogdetLean/FiniteMeasureCurtissProgressAxiomAudit.lean \
            2>&1 | tee "$GITHUB_WORKSPACE/curtiss-progress-axioms.log"
          grep -F 'finiteMeasureGaussianMassApproximation_of_laplace' \
            "$GITHUB_WORKSPACE/curtiss-progress-axioms.log"
          grep -F 'finiteMeasureCDFApproximation_of_small_mass' \
            "$GITHUB_WORKSPACE/curtiss-progress-axioms.log"

      - name: Scan new modules for prohibited placeholders
        shell: bash
        run: |
          set -euo pipefail
          cd '${{ steps.locate.outputs.project }}'
          files=(
            LogdetLean/FiniteMeasureCurtissProgress.lean
            LogdetLean/FiniteMeasureCurtissProgressAxiomAudit.lean
          )
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^[[:space:]]*(axiom|opaque)[[:space:]]+' "${files[@]}"; then
            echo 'A prohibited placeholder or declaration occurs in a new module.' >&2
            exit 1
          fi
          {
            echo '# Moving-H finite-measure Curtiss progress truth boundary'
            echo
            echo 'Kernel target 1: total-mass approximation from the real-Laplace contract.'
            echo 'Kernel target 2: uniform CDF approximation on the vanishing-mass branch.'
            echo 'Still open: the positive-mass Laplace-uniqueness/Curtiss branch.'
            echo 'Still open: the high-dimensional Gaussian maximum/void input.'
          } | tee "$GITHUB_WORKSPACE/curtiss-progress-truth-boundary.log"

      - name: Upload progress evidence
        uses: actions/upload-artifact@v4
        with:
          name: moving-h-curtiss-progress-evidence
          path: |
            curtiss-progress-build.log
            curtiss-progress-axioms.log
            curtiss-progress-truth-boundary.log
          if-no-files-found: error
